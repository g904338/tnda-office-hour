# Supabase pauses free projects after a week without traffic. A tiny
# daily read keeps the database awake between semesters' busy weeks.
name: Keep database awake

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Call the public endpoint
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS "$VITE_SUPABASE_URL/rest/v1/rpc/oh_public" \
            -H "apikey: $VITE_SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' > /dev/null
          echo "ok"
